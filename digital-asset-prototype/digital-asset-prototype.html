const $ = (sel, parent=document) => parent.querySelector(sel);
const $$ = (sel, parent=document) => [...parent.querySelectorAll(sel)];

function htmlEscape(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtSize(b) {
  if (b == null) return '-';
  if (b < 1024) return b + ' B';
  if (b < 1024*1024) return (b/1024).toFixed(1) + ' KB';
  if (b < 1024*1024*1024) return (b/1024/1024).toFixed(1) + ' MB';
  return (b/1024/1024/1024).toFixed(2) + ' GB';
}

function roleOf(assetId) {
  return state.assets.find(a => a.assetId === assetId);
}
function versionOf(versionId) {
  return state.versions.find(v => v.versionId === versionId);
}
function versionsOf(assetId) {
  return state.versions.filter(v => v.assetId === assetId).sort((a,b) => a.createdAt > b.createdAt);
}
function submissionsOf(assetId) {
  return state.submissions.filter(s => s.assetId === assetId).sort((a,b) => (b.submittedAt||'').localeCompare(a.submittedAt||''));
}
function submissionsByVersion(versionId) {
  return state.submissions.filter(s => s.versionId === versionId);
}
function importsOf(assetId) {
  return state.imports.filter(i => i.assetId === assetId).sort((a,b) => (b.startedAt||'').localeCompare(a.startedAt||''));
}
function validationsOf(versionId) {
  return state.validations[versionId] || [];
}

function tag(code, dict, labelOverride) {
  if (!code) return `<span class="tag">—</span>`;
  const s = dict[code];
  if (!s) return `<span class="tag">${htmlEscape(code)}</span>`;
  return `<span class="tag ${s.cls}">${htmlEscape(labelOverride || s.label)}</span>`;
}

const Toast = {
  show(title, msg, type='info', ms=3200) {
    const icons = {
      success: '<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 6L9 17l-5-5"/></svg>',
      error:   '<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>',
      warning: '<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>',
      info:    '<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>'
    };
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.innerHTML = `${icons[type] || icons.info}
      <div class="toast-content"><div class="toast-title">${htmlEscape(title)}</div>${msg ? `<div class="toast-msg">${htmlEscape(msg)}</div>` : ''}</div>
      <button class="toast-close" onclick="this.parentElement.remove()">×</button>`;
    $('#toastContainer').appendChild(el);
    setTimeout(() => { el.style.transition = 'opacity 0.25s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 260); }, ms);
  }
};

const Modal = {
  show(opts) {
    const { title, body, onConfirm, confirmText='确认', cancelText='取消', danger=false, size=520, hideCancel=false } = opts;
    const overlay = document.createElement('div');
    overlay.className = 'overlay show';
    overlay.innerHTML = `<div class="modal" style="width:${size}px">
      <div class="modal-header"><div class="modal-title">${htmlEscape(title)}</div><button class="modal-close">×</button></div>
      <div class="modal-body"></div>
      <div class="modal-footer"></div>
    </div>`;
    const bodyEl = $('.modal-body', overlay), footEl = $('.modal-footer', overlay);
    if (typeof body === 'string') bodyEl.innerHTML = body;
    else bodyEl.appendChild(body);
    const confirmBtn = document.createElement('button');
    confirmBtn.className = `btn ${danger ? 'btn-danger' : 'btn-primary'}`;
    confirmBtn.textContent = confirmText;
    const close = () => overlay.remove();
    confirmBtn.onclick = async () => {
      confirmBtn.disabled = true;
      confirmBtn.innerHTML = '<span class="spinner"></span> 处理中...';
      try { await onConfirm?.({ close, bodyEl }); } finally { confirmBtn.disabled = false; confirmBtn.textContent = confirmText; }
    };
    footEl.appendChild(confirmBtn);
    if (!hideCancel) {
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'btn btn-secondary';
      cancelBtn.textContent = cancelText;
      cancelBtn.onclick = close;
      footEl.appendChild(cancelBtn);
    }
    $('.modal-close', overlay).onclick = close;
    overlay.onclick = (e) => { if (e.target === overlay) close(); };
    document.body.appendChild(overlay);
    return { close, bodyEl };
  },
  confirm({ title, message, onConfirm, danger=false, confirmText='确认', cancelText='取消' }) {
    return Modal.show({ title, body: `<div style="font-size:14px;color:var(--ink-2);line-height:1.65">${message}</div>`, onConfirm, confirmText, cancelText, danger });
  }
};

function renderAssetRowActions(a) {
  let actions = '';
  const hasPendingSubmission = submissionsOf(a.assetId).some(s => ['PENDING_APPROVAL','VALIDATING'].includes(s.submissionStatus));
  const latestFrozen = versionsOf(a.assetId).find(v => v.versionStatus === 'FROZEN');

  // 发起投稿
  if (a.assetStatus !== 'ARCHIVED' && !hasPendingSubmission) {
    // 要有冻结版本才能投稿
    const canSubmit = !!latestFrozen && latestFrozen.assetId === a.assetId; // 确保属于当前资产
    if (canSubmit) {
      actions += `<button class="btn-link" onclick="submitAsset('${latestFrozen.versionId}')">发起投稿</button>`;
    } else {
      const dratfVer = versionsOf(a.assetId).find(v => v.versionStatus === 'DRAFT');
      if (dratfVer) {
        actions += `<button class="btn-link" onclick="freezeVersion('${dratfVer.versionId}')">冻结后投稿</button>`;
      }
    }
  }
  // 禁用/启用/归档
  if (a.assetStatus === 'PUBLISHED') actions += `<button class="btn-link danger-link" onclick="disableAsset('${a.assetId}')">禁用</button>`;
  if (a.assetStatus === 'DISABLED') actions += `<button class="btn-link success-link" onclick="enableAsset('${a.assetId}')">启用</button>`;
  if (a.assetStatus === 'DRAFT' || a.assetStatus === 'DISABLED') actions += `<button class="btn-link danger-link" onclick="archiveAsset('${a.assetId}')">归档</button>`;
  return actions;
}

/* ============================
   12. 版本详情 (Drawer)
   ============================ */
function openVersionDetail(versionId) {
  const v = versionOf(versionId);
  if (!v) return;
  const a = roleOf(v.assetId);
  const validations = validationsOf(versionId);
  const subs = submissionsByVersion(versionId);

  let valHtml = '';
  if (validations.length === 0) {
    valHtml = `<div class="info-banner info">尚未执行固定校验（版本状态为 DRAFT 时不执行校验）</div>`;
  } else {
    const errCount = validations.reduce((n, vr) => n + vr.issues.filter(i => i.severity === 'ERROR').length, 0);
    const warnCount = validations.reduce((n, vr) => n + vr.issues.filter(i => i.severity === 'WARNING').length, 0);
    const passCount = validations.filter(vr => vr.passed).length;
    valHtml = `
      <div class="validation-summary">
        <div class="val-stat pass"><span class="num">${passCount}</span> 项通过</div>
        ${errCount > 0 ? `<div class="val-stat err"><span class="num">${errCount}</span> 阻断性错误</div>` : ''}
        ${warnCount > 0 ? `<div class="val-stat warn"><span class="num">${warnCount}</span> 警告</div>` : ''}
        ${validations.some(vr => !vr.checkedAt) ? `<div class="val-stat unknown"><span class="num">?</span> 未知结果</div>` : ''}
      </div>
      <div style="margin-top:10px">
        ${validations.map(vr => {
          const severity = vr.issues.some(i => i.severity === 'ERROR') ? 'err' : (vr.issues.some(i => i.severity === 'WARNING') ? 'warn' : (vr.passed ? 'pass' : 'err'));
          const checkerLabel = { RESOURCE_PRESENCE: '资源存在性检查', DEPENDENCY_ANALYSIS: '依赖分析', CONTRACT_COMPAT: '契约兼容性检查', SECURITY_SCAN: '安全扫描' }[vr.checkerType] || vr.checkerType;
          return `<div style="margin-bottom:14px;border:1px solid var(--rule);border-radius:10px;padding:14px">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
              <strong>${htmlEscape(checkerLabel)}</strong>
              ${tag(vr.passed ? 'PASSED' : 'FAILED', VALIDATION_STATE)}
              <span class="muted-text" style="margin-left:auto;font-size:12px">${htmlEscape(vr.checkedAt || '—')}</span>
            </div>
            ${vr.issues.length === 0 ? '<div class="muted-text" style="font-size:12px">无问题</div>' :
              vr.issues.map(i => `
                <div class="issue-row">
                  <div class="iss-code">${htmlEscape(i.issueCode)}</div>
                  <div>
                    <div class="iss-desc">${htmlEscape(i.description)}</div>
                    ${i.resolutionSuggestion ? `<div class="iss-suggestion">💡 处理建议：${htmlEscape(i.resolutionSuggestion)}</div>` : ''}
                  </div>
                  <span class="tag ${i.severity === 'ERROR' ? 'tag-error' : 'tag-warning'}">${i.severity === 'ERROR' ? '阻断' : '警告'}</span>
                </div>
              `).join('')}
          </div>`;
        }).join('')}
      </div>
    `;
  }

  UI.openDrawer(`
    <div class="drawer-header">
      <div>
        <div class="drawer-title">${htmlEscape(a.assetName)} · ${htmlEscape(v.versionNumber)}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:4px">${tag(v.versionStatus, VERSION_STATUS)} · 版本 ID <span class="code-mono">${htmlEscape(v.versionId)}</span></div>
      </div>
      <button class="drawer-close" onclick="UI.closeDrawer()">×</button>
    </div>
    <div class="drawer-body">
      <div class="detail-section">
        <div class="detail-section-title">📦 快照信息</div>
        <div class="detail-grid-3">
          <div class="detail-item"><div class="detail-label">快照 ID (snapshotId)</div><div class="detail-value mono">${v.snapshotId || '<span class="empty">未生成</span>'}</div></div>
          <div class="detail-item"><div class="detail-label">快照大小</div><div class="detail-value">${fmtSize(v.snapshotSize)}</div></div>
          <div class="detail-item"><div class="detail-label">快照生成时间</div><div class="detail-value">${htmlEscape(v.snapshotCreatedAt || '—')}</div></div>
          <div class="detail-item full"><div class="detail-label">快照摘要 (snapshotDigest)</div><div class="detail-value mono" style="font-size:11px;word-break:break-all">${v.snapshotDigest || '<span class="empty">—</span>'}</div></div>
          <div class="detail-item"><div class="detail-label">冻结时间</div><div class="detail-value">${htmlEscape(v.frozenAt || '—')}</div></div>
          <div class="detail-item"><div class="detail-label">创建人</div><div class="detail-value code-mono">${htmlEscape(v.createdBy)}</div></div>
          <div class="detail-item"><div class="detail-label">创建时间</div><div class="detail-value">${htmlEscape(v.createdAt)}</div></div>
        </div>
      </div>

      ${v.dependencies && v.dependencies.length > 0 ? `
      <div class="detail-section">
        <div class="detail-section-title">🔗 依赖资源</div>
        ${v.dependencies.map(d => `
          <div style="padding:10px 0;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between">
            <div>
              <div style="font-weight:600;font-size:13px">${htmlEscape(d.name)} <span class="code-mono">${htmlEscape(d.resourceId)}</span></div>
              <div style="font-size:12px;color:var(--muted)">${htmlEscape(d.resourceType)}</div>
            </div>
            <span class="tag ${d.depType === 'REQUIRED' ? 'tag-error' : 'tag-info'}">${d.depType === 'REQUIRED' ? '必需' : '可选'}</span>
          </div>
        `).join('')}
      </div>` : ''}

      <div class="detail-section">
        <div class="detail-section-title">✅ 固定校验结果</div>
        ${valHtml}
      </div>

      ${subs.length > 0 ? `
      <div class="detail-section">
        <div class="detail-section-title">📝 关联投稿</div>
        <div style="display:flex;flex-direction:column;gap:8px">
          ${subs.map(s => `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--bg3);border-radius:8px">
            <div><span class="code-mono">${htmlEscape(s.submissionId)}</span> <span style="margin-left:8px">${htmlEscape(s.submittedByName)} · ${htmlEscape(s.submittedAt)}</span></div>
            ${tag(s.submissionStatus, SUBMISSION_STATUS)}
          </div>`).join('')}
        </div>
      </div>` : ''}
    </div>
  `);
}

/* ============================
   13. 资源登记向导（6 步）
   ============================ */
function renderWizard(root) {
  state.wizard = state.wizard || { step: 1, resourceId: null, assetName: '', assetCode: '', assetType: null, description: '', visibility: 'PRIVATE', type: '', dependenciesDetected: [], validation: null, snapshotId: null };
  const steps = ['选择资源', '识别类型/依赖', '前置检查', '生成快照', '固定校验', '登记/投稿'];
  const w = state.wizard;

  let body = '';
  if (w.step === 1) body = wizardStep1(w);
  else if (w.step === 2) body = wizardStep2(w);
  else if (w.step === 3) body = wizardStep3(w);
  else if (w.step === 4) body = wizardStep4(w);
  else if (w.step === 5) body = wizardStep5(w);
  else body = wizardStep6(w);

  root.innerHTML = `
    <div class="page-header"><div>
      <div class="page-title">资源登记向导</div>
      <div class="page-subtitle">选择平台原生资源 → 识别依赖 → 校验 → 生成快照 → 登记资产 → 发起投稿（6 步）</div>
    </div><div class="page-actions">
      <button class="btn btn-ghost" onclick="state.wizard=null; navigate('assetList')">取消向导</button>
    </div></div>

    <div class="card"><div class="card-body">
      <div class="wizard-steps">

  ];

  const hasError = checkerSteps.some(c => c.issues.some(i => i.severity === 'ERROR'));
  const hasWarning = checkerSteps.some(c => c.issues.some(i => i.severity === 'WARNING'));

  if (hasError) banner = `<div class="info-banner error"><svg class="ib-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg><div><strong>存在阻断性错误！</strong>根据业务规则，有 ERROR 时禁止投稿。请修正后重新生成快照。</div></div>`;
  else if (hasWarning) banner = `<div class="info-banner warning"><svg class="ib-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg><div><strong>存在 ${checkerSteps.reduce((n,c) => n + c.issues.filter(i=>i.severity==='WARNING').length,0)} 条警告。</strong>警告不阻断投稿，但建议根据处理建议优化。</div></div>`;
  else banner = `<div class="info-banner success"><svg class="ib-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg><div><strong>校验全部通过 ✅</strong> 所有检查项均未发现问题，可以继续登记并发起投稿。</div></div>`;

  const errCount = checkerSteps.reduce((n,c) => n + c.issues.filter(i=>i.severity==='ERROR').length, 0);
  const warnCount = checkerSteps.reduce((n,c) => n + c.issues.filter(i=>i.severity==='WARNING').length, 0);

  return `
    <div class="info-banner info">
      <svg class="ib-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>

    </div>
    ${banner}
    <div class="validation-summary">
      <div class="val-stat pass"><span class="num">${checkerSteps.filter(c=>c.pass && c.issues.length===0).length}</span> 通过</div>
      <div class="val-stat err"><span class="num">${errCount}</span> 阻断错误</div>
      <div class="val-stat warn"><span class="num">${warnCount}</span> 警告</div>
    </div>
    ${checkerSteps.map(c => `
      <div style="margin-bottom:14px;border:1px solid var(--rule);border-radius:10px;overflow:hidden">
        <div style="padding:12px 16px;background:${c.pass?'var(--success-soft)':(c.issues.some(i=>i.severity==='ERROR')?'var(--danger-soft)':'var(--warning-soft)')};display:flex;justify-content:space-between;align-items:center">
          <div style="font-weight:600;font-size:13px">${htmlEscape(c.label)}</div>
          <span class="tag ${c.pass?'tag-published':(c.issues.some(i=>i.severity==='ERROR')?'tag-error':'tag-warning')}">${c.pass?'通过':'发现问题'}</span>
        </div>
        ${c.issues.length > 0 ? `<div style="padding:10px 16px">
          ${c.issues.map(i => `<div class="issue-row" style="margin-bottom:6px">
            <div class="iss-code">${htmlEscape(i.code)}</div>
            <div class="iss-desc">${htmlEscape(i.desc)}</div>
            <span class="tag ${i.severity==='ERROR'?'tag-error':'tag-warning'}">${i.severity==='ERROR'?'ERROR':'WARNING'}</span>
          </div>`).join('')}
        </div>` : ''}
      </div>`).join('')}
    <div style="margin-top:20px;display:flex;justify-content:space-between">
      <button class="btn btn-secondary" onclick="wizardPrev()">← 上一步</button>
      <button class="btn btn-primary" ${hasError?'disabled':''} onclick="wizardNext()">${hasError?'有错误，禁止下一步':'下一步：登记并投稿 →'}</button>
    </div>
  `;
}

function selectWizardResource(id) { state.wizard.resourceId = id; renderWizard($('#content')); }
function wizardNext() { state.wizard.step++; renderWizard($('#content')); if (state.wizard.step === 4) runSnapshotProgress(); }
function wizardPrev() { state.wizard.step--; renderWizard($('#content')); }

function runSnapshotProgress() {
  const w = state.wizard;
  const steps = [
    { label: '调用 Provider 拉取资源内容', done: false },
    { label: '扫描并固化依赖资源引用', done: false },
    { label: '计算 SHA-256 摘要', done: false },
    { label: '写入快照存储（只读）', done: false },
    { label: '返回 snapshotId 与 metadata', done: false }
  ];
  const prog = $('#snapshotProgress');
  prog.innerHTML = `<div style="display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--bg3);border-radius:10px">
    ${steps.map((s,i) => `<div id="ss-${i}" style="display:flex;align-items:center;gap:10px"><div style="width:20px;height:20px;border-radius:50%;background:var(--rule-2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px">${i+1}</div><div style="font-size:13px;color:var(--ink-2)">${s.label}</div><div style="margin-left:auto"><span class="spinner dark"></span></div></div>`).join('')}
    <div class="progress-bar" style="margin-top:6px"><span style="width:0%"></span></div>
    <div style="font-size:11px;color:var(--muted);margin-top:2px">快照 ID 将在完成后生成</div>
  </div>`;
  let i = 0;
  function next() {
    if (i >= steps.length) {
      prog.style.display = 'none';
      $('#snapshotResult').classList.remove('hidden');
      return;
    }
    const el = $(`#ss-${i}`);
    el.querySelector('div:first-child').style.background = 'var(--accent)';
    el.querySelector('div:last-child').innerHTML = '<span style="color:var(--accent);font-size:12px">执行中...</span>';
    setTimeout(() => {
      el.querySelector('div:first-child').style.background = 'var(--success)';
      el.querySelector('div:first-child').textContent = '✓';
      el.querySelector('div:last-child').innerHTML = '<span style="color:var(--success);font-size:12px">完成</span>';
      const pct = ((i+1) / steps.length * 100).toFixed(0);
      $('.progress-bar > span', prog).style.width = pct + '%';
      i++; next();
    }, 550);
  }
  next();
}

function completeWizard() {
  const w = state.wizard;
  const r = state.platformResources.find(x => x.resourceId === w.resourceId);
  const type = assetTypes.find(t => t.code === r.resourceType);
  const name = $('#w-asset-name').value.trim();
  const code = $('#w-asset-code').value.trim();
  const desc = $('#w-asset-desc').value.trim();
  const vis = $('#w-visibility').value;
  if (!name || !code) { Toast.show('请填写必填项','资产名称和资产标识不能为空','warning'); return; }

  // 模拟创建
  const ts = new Date().toISOString().replace('T',' ').slice(0,19);
  const assetId = 'AST-2026-' + String(state.assets.length+1).padStart(4,'0');
  const versionId = 'VER-' + assetId.split('-')[2] + '-001';
  const subId = 'SUB-' + ts.slice(0,4) + '-' + String(state.submissions.length+1).padStart(4,'0');

  state.assets.push({
    assetId, assetCode: code, assetName: name, assetType: r.resourceType,
    description: desc, assetStatus: 'DRAFT', publishedVersionId: null,

function approvalTag(result) {
  if (!result) return '<span class="tag tag-draft">—</span>';
  if (result === 'APPROVED') return `<span class="tag tag-approved">通过</span>`;
  if (result === 'RETURNED') return `<span class="tag tag-returned">退回</span>`;
  if (result === 'REJECTED') return `<span class="tag tag-rejected">不通过</span>`;
  return `<span class="tag">${htmlEscape(result)}</span>`;
}

function renderValidationPanel(validations) {
  const errCount = validations.reduce((n, vr) => n + vr.issues.filter(i => i.severity === 'ERROR').length, 0);
  const warnCount = validations.reduce((n, vr) => n + vr.issues.filter(i => i.severity === 'WARNING').length, 0);
  const passCount = validations.filter(vr => vr.passed && vr.issues.length === 0).length;
  const checkerLabelMap = { RESOURCE_PRESENCE:'资源存在性检查', DEPENDENCY_ANALYSIS:'依赖分析', CONTRACT_COMPAT:'契约兼容性检查', SECURITY_SCAN:'安全扫描' };
  let out = `
    <div class="validation-summary">
      <div class="val-stat pass"><span class="num">${passCount}</span> 通过</div>
      ${errCount>0?`<div class="val-stat err"><span class="num">${errCount}</span> 阻断错误</div>`:''}
      ${warnCount>0?`<div class="val-stat warn"><span class="num">${warnCount}</span> 警告</div>`:''}
      ${validations.some(vr => !vr.checkedAt)?`<div class="val-stat unknown"><span class="num">?</span> 未知</div>`:''}
    </div>
    ${validations.map(vr => `
      <div style="margin-bottom:12px;border:1px solid var(--rule);border-radius:10px;overflow:hidden">
        <div style="padding:10px 16px;background:${vr.pass?'var(--success-soft)':'var(--danger-soft)'};display:flex;justify-content:space-between;align-items:center">
          <div style="font-weight:600;font-size:13px">${checkerLabelMap[vr.checkerType] || vr.checkerType}</div>
          <div style="display:flex;gap:8px;align-items:center">
            <span style="font-size:11px;color:var(--muted)">${htmlEscape(vr.checkedAt)}</span>
            ${tag(vr.pass?'PASSED':'FAILED', VALIDATION_STATE)}
          </div>
        </div>
        ${vr.issues.length > 0 ? `<div style="padding:10px 16px">
          ${vr.issues.map(i => `<div class="issue-row"><div class="iss-code">${htmlEscape(i.issueCode)}</div><div><div class="iss-desc">${htmlEscape(i.description)}</div>${i.resolutionSuggestion?`<div class="iss-suggestion">💡 ${htmlEscape(i.resolutionSuggestion)}</div>`:''}</div><span class="tag ${i.severity==='ERROR'?'tag-error':'tag-warning'}">${i.severity==='ERROR'?'阻断':'警告'}</span></div>`).join('')}
        </div>` : '<div style="padding:6px 16px;font-size:12px;color:var(--muted)">无问题</div>'}
      </div>`).join('')}
  `;
  return out;
}

function freezeVersion(versionId) {
  const v = versionOf(versionId);
  if (!v) return;
  if (v.versionStatus !== 'DRAFT') { Toast.show('无法冻结', '只有 DRAFT 版本才能冻结', 'warning'); return; }

  Modal.confirm({
    title: '冻结版本',
    message: `冻结后版本 <strong>${v.versionNumber}</strong> 的快照将成为只读固定快照，后续不能直接修改。<br>是否继续？`,
    danger: false,
    onConfirm: async ({ close }) => {
      await new Promise(r => setTimeout(r, 800));
      v.versionStatus = 'FROZEN';
      v.snapshotId = 'SNAP-SHA256-' + v.assetId.replace('AST-','').replace(/-/g,'') + '-' + Date.now().toString(36).toUpperCase();
      v.snapshotDigest = 'SIMULATED-SHA256-' + Math.random().toString(36).slice(2,40).toUpperCase();
      v.snapshotSize = v.snapshotSize || Math.floor(Math.random() * 5000000) + 100000;
      v.snapshotCreatedAt = v.snapshotCreatedAt || new Date().toISOString().replace('T',' ').slice(0,19);
      v.frozenAt = new Date().toISOString().replace('T',' ').slice(0,19);
      state.activities.unshift({ id: 'ACT-'+Date.now(), time: v.frozenAt, actor: '王丽', actorId: 'u-wangli', type: 'FREEZE_VERSION', target: v.versionId, targetName: `${roleOf(v.assetId)?.assetName} · ${v.versionNumber}`, targetType: 'VERSION', status: 'DONE', message: '冻结版本，生成固定快照' });
      close();
      Toast.show('版本已冻结', `${v.versionNumber} 已生成固定快照，可发起投稿`, 'success');
      // 刷新当前页面
      const curPage = state.navPage;
      navigate(curPage);
    }
  });
}

function submitAsset(versionId) {
  const v = versionOf(versionId);
  const a = roleOf(v.assetId);
  // 前置检查：版本必须是 FROZEN
  if (v.versionStatus !== 'FROZEN') { Toast.show('前置条件不满足','版本未冻结，不能发起投稿','error',3500); return; }
  // 校验：不能有阻断性错误
  const val = validationsOf(versionId);
  const hasErr = val.some(vr => vr.issues.some(i => i.severity === 'ERROR'));
  if (hasErr) {
    Modal.show({
      title: '存在阻断性错误',
      body: `<div class="info-banner error"><svg class="ib-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg><div><strong>业务层禁止绕行：</strong>当前版本存在阻断性 ERROR，按既定业务规则禁止投稿。</div></div>
        <div style="margin-top:10px">问题清单：${val.reduce((n,vr) => n + vr.issues.filter(i=>i.severity==='ERROR').length, 0)} 条阻断性错误</div>`,
      confirmText: '我知道了',
      hideCancel: true,
      onConfirm: async ({ close }) => { close(); }
    });
    return;
  }
  // 检查是否已有待处理投稿
  const pending = state.submissions.filter(s => s.versionId === versionId && ['PENDING_APPROVAL','VALIDATING'].includes(s.submissionStatus));
  if (pending.length > 0) { Toast.show('已有进行中的投稿','请等待现有投稿处理完成','warning'); return; }

  Modal.show({
    title: '发起投稿',
    body: `<div style="font-size:13px;color:var(--ink-2)">将对资产 <strong>${htmlEscape(a.assetName)}</strong> 的冻结版本 <strong>${v.versionNumber}</strong> 发起投稿，提交到现有审批工作流。</div>
      <div style="margin-top:14px;padding:14px;background:var(--bg3);border-radius:10px;font-size:12px;color:var(--ink-3)">
        <strong style="color:var(--ink)">快照 ID：</strong>${v.snapshotId}<br>
        <strong style="color:var(--ink)">工作流：</strong>WF-APPROVAL-xxx（通过现有工作流衔接）<br>
        <strong style="color:var(--ink)">校验结果：</strong>${tag(val.every(vr=>vr.passed)?'PASSED':'FAILED', VALIDATION_STATE)}
      </div>`,
    confirmText: '确认提交',
    onConfirm: async ({ close }) => {
      await new Promise(r => setTimeout(r, 600));
      const ts = new Date().toISOString().replace('T',' ').slice(0,19);
      const subId = 'SUB-' + ts.slice(0,4) + '-' + String(state.submissions.length+1).padStart(4,'0');
      state.submissions.push({
        submissionId: subId, assetId: v.assetId, versionId: v.versionId,
        submissionStatus: 'PENDING_APPROVAL',
        submittedBy: 'u-wangli', submittedByName: '王丽', submittedAt: ts,
        workflowInstanceId: 'WF-APPROVAL-' + Math.floor(10000+Math.random()*90000),
        approvalResult: null, approvalComment: null, approvalCompletedAt: null, approvalBy: null, approvalByName: null,
        publicationStatus: 'NOT_STARTED', publicationMessage: null
      });
      a.updatedAt = ts;
      state.activities.unshift({ id:'ACT-'+Date.now(), time:ts, actor:'王丽', actorId:'u-wangli', type:'SUBMIT', target:v.assetId, targetName:`${a.assetName} ${v.versionNumber}`, targetType:'SUBMISSION', status:'PENDING', message:'发起投稿，等待审批' });
      close();
      Toast.show('投稿已提交',`${v.versionNumber} 已进入审批工作流`,'success');
      state.currentSubmissionId = subId;
      navigate('submissionDetail');
    }
  });
}

function doApproval(submissionId, action) {
  const s = state.submissions.find(x => x.submissionId === submissionId);
  if (!s) return;
  if (s.submissionStatus !== 'PENDING_APPROVAL') { Toast.show('状态不允许审批', '当前投稿不是待审批状态', 'warning'); return; }

  const comment = $('#approvalComment')?.value || (action === 'APPROVED' ? '内容完整，同意审批。' : action === 'RETURNED' ? '请根据退回意见修正后重新提交。' : '不通过，具体请查看意见。');
  const label = action === 'APPROVED' ? '审批通过' : action === 'RETURNED' ? '退回修改' : '审批不通过';
  const danger = action === 'REJECTED';

  Modal.confirm({
    title: label,
    message: `确定对投稿 <strong>${s.submissionId}</strong> 执行「<strong style="color:${action==='APPROVED'?'var(--success)':action==='RETURNED'?'var(--warning)':'var(--danger)'}">${label}</strong>」吗？`,
    danger,
    confirmText: '确认执行',
    onConfirm: async ({ close }) => {
      await new Promise(r => setTimeout(r, 700));
      const ts = new Date().toISOString().replace('T',' ').slice(0,19);
      s.submissionStatus = action === 'APPROVED' ? 'APPROVED' : (action === 'RETURNED' ? 'RETURNED' : 'REJECTED');
      s.approvalResult = action;
      s.approvalComment = comment;
      s.approvalCompletedAt = ts;
      s.approvalBy = 'u-liuying';
      s.approvalByName = '刘颖';
      state.activities.unshift({ id:'ACT-'+Date.now(), time:ts, actor:'刘颖', actorId:'u-liuying', type:action, target:s.submissionId, targetName:roleOf(s.assetId)?.assetName, targetType:'SUBMISSION', status:'DONE', message:label + '：' + (comment?.slice(0,40) || '') });
      close();
      Toast.show(label + ' 成功', '', action === 'APPROVED' ? 'success' : 'info');
      state.currentReviewSubmission = null;
      const curPage = state.navPage;
      navigate(curPage);
    }
  });
}

function resubmitSubmission(submissionId) {
  const s = state.submissions.find(x => x.submissionId === submissionId);
  if (!s) return;
  if (s.submissionStatus !== 'RETURNED' && s.submissionStatus !== 'REJECTED') { Toast.show('状态不允许重新提交','仅退回或不通过的投稿可以重新提交','warning'); return; }
  const v = versionOf(s.versionId);
  if (!v || v.versionStatus !== 'FROZEN') { Toast.show('版本未冻结','请先冻结修正后的新版本','warning'); return; }
  // 检查校验是否通过
  const val = validationsOf(s.versionId);
  const hasErr = val.some(vr => vr.issues.some(i => i.severity === 'ERROR'));
  if (hasErr) { Toast.show('仍有阻断性错误','请先修正后再重新提交','error',3500); return; }

  Modal.confirm({
    title: '重新提交投稿',
    message: `基于版本 <strong>${v.versionNumber}</strong> 重新发起审批。将保留追溯关联。`,
    onConfirm: async ({ close }) => {
      await new Promise(r => setTimeout(r, 500));
      const ts = new Date().toISOString().replace('T',' ').slice(0,19);
      const newId = 'SUB-' + ts.slice(0,4) + '-' + String(state.submissions.length+1).padStart(4,'0');
      state.submissions.push({
        submissionId: newId, assetId: s.assetId, versionId: s.versionId,
        submissionStatus: 'PENDING_APPROVAL',
        submittedBy: s.submittedBy, submittedByName: s.submittedByName, submittedAt: ts,
        workflowInstanceId: 'WF-APPROVAL-' + Math.floor(10000+Math.random()*90000),
        approvalResult: null, approvalComment: null, approvalCompletedAt: null, approvalBy: null, approvalByName: null,
        publicationStatus: 'NOT_STARTED', publicationMessage: null
      });
      state.activities.unshift({ id:'ACT-'+Date.now(), time:ts, actor:s.submittedByName, actorId:s.submittedBy, type:'RESUBMIT', target:newId, targetName:`${roleOf(s.assetId)?.assetName} ${v.versionNumber}`, targetType:'SUBMISSION', status:'PENDING', message:'根据退回意见重新提交' });
      close();
      Toast.show('已重新提交', '等待审批中', 'success');
      state.currentSubmissionId = newId;
      navigate('submissionDetail');
    }
  });
}

function cancelSubmission(submissionId) {
  const s = state.submissions.find(x => x.submissionId === submissionId);
  if (!s) return;
  if (!['DRAFT','PENDING_APPROVAL','VALIDATING'].includes(s.submissionStatus)) { Toast.show('状态不允许取消','已处理的投稿不能取消','warning'); return; }
  Modal.confirm({
    title: '取消投稿',
    message: `确认取消投稿 <strong>${s.submissionId}</strong>？此操作不可撤销。`,
    danger: true,
    onConfirm: async ({ close }) => {
      await new Promise(r => setTimeout(r, 400));
      s.submissionStatus = 'CANCELLED';
      state.activities.unshift({ id:'ACT-'+Date.now(), time:new Date().toISOString().replace('T',' ').slice(0,19), actor:s.submittedByName, actorId:s.submittedBy, type:'CANCEL', target:s.submissionId, targetName:roleOf(s.assetId)?.assetName, targetType:'SUBMISSION', status:'DONE', message:'取消投稿' });
      close();
      Toast.show('投稿已取消','', 'warning');
      navigate('submissionList');
    }
  });
}

function publishAsset(submissionId) {
  const s = state.submissions.find(x => x.submissionId === submissionId);
  if (!s) return;
  if (s.submissionStatus !== 'APPROVED') { Toast.show('发布前置条件不满足','投稿必须先审批通过','error',3500); return; }
  const v = versionOf(s.versionId);
  if (!v || v.versionStatus !== 'FROZEN') { Toast.show('版本未冻结','发布前版本必须 FROZEN','error',3500); return; }
  const a = roleOf(s.assetId);

  Modal.show({
    title: '执行发布',
    body: `<div class="info-banner info">
      <svg class="ib-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>
      <div><strong>发布前校验已通过：</strong>投稿 APPROVED，版本 FROZEN，快照存在。发布成功后资产状态将变为 PUBLISHED，目录可见。</div>
    </div>
    <div class="detail-grid" style="margin-top:14px">
      <div class="detail-item"><div class="detail-label">资产</div><div class="detail-value">${htmlEscape(a.assetName)}</div></div>
      <div class="detail-item"><div class="detail-label">版本</div><div class="detail-value">${htmlEscape(v.versionNumber)}</div></div>
      <div class="detail-item"><div class="detail-label">快照</div><div class="detail-value mono">${htmlEscape(v.snapshotId)}</div></div>
      <div class="detail-item"><div class="detail-label">将变更为</div><div class="detail-value">资产状态 → ${tag('PUBLISHED', ASSET_STATUS)}</div></div>
    </div>
    <div style="margin-top:10px">
      <label class="form-label">发布模拟结果</label>
      <select class="form-select" id="pubResult">
        <option value="success">✅ 发布成功（正常场景）</option>
        <option value="fail-connector">❌ 失败：Provider 超时（依赖 ERP 连接器）</option>
        <option value="fail-snapshot">❌ 失败：快照完整性校验失败（SHA 不匹配）</option>
      </select>
      <div class="form-hint">为演示异常分支，可模拟不同结果。发布失败时资产状态 <strong>不会</strong> 被改为 PUBLISHED。</div>
    </div>`,
    confirmText: '执行发布',
    onConfirm: async ({ close }) => {
      await new Promise(r => setTimeout(r, 1200));
      const res = $('#pubResult').value;
      const ts = new Date().toISOString().replace('T',' ').slice(0,19);
      if (res === 'success') {
        s.publicationStatus = 'SUCCESS';
        s.publicationMessage = '资产发布成功，目录已更新。';
        a.assetStatus = 'PUBLISHED';
        a.publishedVersionId = v.versionId;
        a.updatedAt = ts;
        state.activities.unshift({ id:'ACT-'+Date.now(), time:ts, actor:'资产管理员', actorId:'u-admin', type:'PUBLISH', target:a.assetId, targetName:`${a.assetName} ${v.versionNumber}`, targetType:'ASSET', status:'DONE', message:'发布成功' });
        Toast.show('发布成功', `${a.assetName} 已进入目录`, 'success');
      } else if (res === 'fail-connector') {
        s.publicationStatus = 'FAILED';
        s.publicationMessage = '发布时依赖的 Provider 超时：Integration Hub 未在 30s 内响应。';
        state.activities.unshift({ id:'ACT-'+Date.now(), time:ts, actor:'系统', actorId:'sys', type:'PUBLISH', target:s.submissionId, targetName:a.assetName, targetType:'SUBMISSION', status:'FAIL', message:'发布失败：Provider 超时' });
        Toast.show('发布失败', 'Provider 超时，资产状态保持不变', 'error', 4000);
      } else {
        s.publicationStatus = 'FAILED';
        s.publicationMessage = '发布失败：快照 SHA-256 摘要与提交时不一致，可能被篡改。';
        state.activities.unshift({ id:'ACT-'+Date.now(), time:ts, actor:'系统', actorId:'sys', type:'PUBLISH', target:s.submissionId, targetName:a.assetName, targetType:'SUBMISSION', status:'FAIL', message:'发布失败：快照摘要校验不通过' });
        Toast.show('发布失败', '快照校验失败，安全机制已阻止发布', 'error', 4000);
      }
      close();
      navigate('submissionDetail');
    }
  });
}

function disableAsset(assetId) {
  const a = roleOf(assetId);
  if (a.assetStatus !== 'PUBLISHED') { Toast.show('状态不允许禁用','只有 PUBLISHED 资产可禁用','warning'); return; }
  Modal.confirm({ title: '禁用资产', message: `禁用后 <strong>${a.assetName}</strong> 将从目录中移除，使用者无法继续获取资产包。历史导入记录不受影响。`, danger: true,
    onConfirm: async ({ close }) => {
      await new Promise(r => setTimeout(r, 400));
      a.assetStatus = 'DISABLED';
      a.updatedAt = new Date().toISOString().replace('T',' ').slice(0,19);
      state.activities.unshift({ id:'ACT-'+Date.now(), time:a.updatedAt, actor:'资产管理员', actorId:'u-admin', type:'DISABLE', target:a.assetId, targetName:a.assetName, targetType:'ASSET', status:'DONE', message:'禁用资产' });
      close(); Toast.show('已禁用', '', 'warning'); navigate(state.navPage);
    }});
}
function enableAsset(assetId) {
  const a = roleOf(assetId);
  if (a.assetStatus !== 'DISABLED') { Toast.show('状态不允许启用','只有 DISABLED 资产可启用','warning'); return; }
  Modal.confirm({ title: '重新启用资产', message: `重新启用后 <strong>${a.assetName}</strong> 将恢复到目录可见状态。`,
    onConfirm: async ({ close }) => {
      await new Promise(r => setTimeout(r, 400));
      a.assetStatus = 'PUBLISHED';
      a.updatedAt = new Date().toISOString().replace('T',' ').slice(0,19);
      state.activities.unshift({ id:'ACT-'+Date.now(), time:a.updatedAt, actor:'资产管理员', actorId:'u-admin', type:'ENABLE', target:a.assetId, targetName:a.assetName, targetType:'ASSET', status:'DONE', message:'重新启用资产' });
      close(); Toast.show('已启用', '', 'success'); navigate(state.navPage);
    }});
}
function archiveAsset(assetId) {
  const a = roleOf(assetId);
  if (a.assetStatus === 'PUBLISHED') { Toast.show('请先禁用资产','PUBLISHED 资产需要先禁用才能归档','warning',3500); return; }
  if (a.assetStatus === 'ARCHIVED') { Toast.show('已归档','','warning'); return; }
  Modal.confirm({ title: '归档资产', message: `归档后资产仍保留用于审计追溯，但不再出现在正常目录中，且不可重新发布。<br><br><strong>目标状态：</strong>${tag('ARCHIVED', ASSET_STATUS)}<br><strong>资产：</strong>${htmlEscape(a.assetName)}`, danger: true,
    onConfirm: async ({ close }) => {
      await new Promise(r => setTimeout(r, 500));
      a.assetStatus = 'ARCHIVED';
      a.updatedAt = new Date().toISOString().replace('T',' ').slice(0,19);
      state.activities.unshift({ id:'ACT-'+Date.now(), time:a.updatedAt, actor:'资产管理员', actorId:'u-admin', type:'ARCHIVE', target:a.assetId, targetName:a.assetName, targetType:'ASSET', status:'DONE', message:'归档资产' });
      close(); Toast.show('已归档','', 'success'); navigate(state.navPage);
    }});
}

  root.innerHTML = `

      <div class="page-title">发布与生命周期</div>

      <div class="metric-card"><div class="metric-label">审批通过待发布</div><div class="metric-value" style="color:var(--warning)">${needsPublish.length}</div><div class="metric-sub">可立即执行发布</div></div>

      <div class="table-wrap"><table class="table">

          ${subs.map(s => {
            const a = roleOf(s.assetId); const v = versionOf(s.versionId);
            return `<tr>
              <td class="code">${htmlEscape(s.submissionId)}</td>
              <td>${htmlEscape(a?.assetName || '—')}</td>

              <td>${tag(s.submissionStatus, SUBMISSION_STATUS)}</td>

              <td style="max-width:260px">${htmlEscape(s.publicationMessage || '—')}</td>

function openCatalogAsset(assetId) {
  const a = roleOf(assetId);
  const v = versionOf(a.publishedVersionId);
  const t = assetTypes.find(x => x.code === a.assetType);
  const canImport = a.assetStatus === 'PUBLISHED';

  UI.openDrawer(`
    <div class="drawer-header"><div>
      <div class="drawer-title">${t?t.icon:'📄'} ${htmlEscape(a.assetName)}</div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px"><span class="code-mono">${htmlEscape(a.assetCode)}</span> · ${tag(a.assetStatus, ASSET_STATUS)}</div>
    </div><button class="drawer-close" onclick="UI.closeDrawer()">×</button></div>
    <div class="drawer-body">
      <div class="detail-section"><div class="detail-section-title">📖 目录详情</div>
        <div style="font-size:13px;color:var(--ink-2);line-height:1.7;margin-bottom:14px">${htmlEscape(a.description)}</div>
        <div class="detail-grid">
          <div class="detail-item"><div class="detail-label">资产类型</div><div class="detail-value">${t?htmlEscape(t.name):htmlEscape(a.assetType)}</div></div>
          <div class="detail-item"><div class="detail-label">来源应用</div><div class="detail-value">${htmlEscape(a.sourceApp)}</div></div>
          <div class="detail-item"><div class="detail-label">租户</div><div class="detail-value">${htmlEscape(a.tenantName)}</div></div>
          <div class="detail-item"><div class="detail-label">可见性</div><div class="detail-value">${htmlEscape(a.visibility)}</div></div>
          <div class="detail-item"><div class="detail-label">当前发布版本</div><div class="detail-value mono">${v?v.versionNumber:'—'}</div></div>
          <div class="detail-item"><div class="detail-label">发布时间</div><div class="detail-value">${htmlEscape(a.updatedAt)}</div></div>
        </div>
      </div>

      <div class="detail-section"><div class="detail-section-title">📦 固定快照</div>
        ${v ? `
        <div class="detail-grid">
          <div class="detail-item"><div class="detail-label">快照 ID</div><div class="detail-value mono">${htmlEscape(v.snapshotId)}</div></div>
          <div class="detail-item"><div class="detail-label">大小</div><div class="detail-value">${fmtSize(v.snapshotSize)}</div></div>
          <div class="detail-item full"><div class="detail-label">SHA-256</div><div class="detail-value mono" style="font-size:11px;word-break:break-all">${htmlEscape(v.snapshotDigest)}</div></div>
        </div>` : '<div class="muted-text">—</div>'}
      </div>

      <div class="detail-section"><div class="detail-section-title">🔗 依赖</div>
        ${v && v.dependencies && v.dependencies.length > 0 ? v.dependencies.map(d => `<div style="padding:8px 0;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between"><div>${htmlEscape(d.name)} <span class="code-mono">${htmlEscape(d.resourceId)}</span></div><span class="tag ${d.depType==='REQUIRED'?'tag-error':'tag-info'}">${d.depType==='REQUIRED'?'必需':'可选'}</span></div>`).join('') : '<div class="muted-text">无外部依赖</div>'}
      </div>

      ${canImport ? `
      <div class="detail-section"><div class="detail-section-title">⚡ 复用 / 导入</div>
        <div class="info-banner info">
          <svg class="ib-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          <div style="font-size:12px">目录中获取资产包前会自动做权限检查和必要的授权校验。导入成功/失败均记录在"导入记录"中。</div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="requestAssetPackage('${a.assetId}')">📦 获取资产包</button>
          <button class="btn btn-secondary" onclick="requestImport('${a.assetId}')">📥 一键导入到目标应用</button>
        </div>
      </div>` : ''}
    </div>
  `);
}

function requestAssetPackage(assetId) {
  const a = roleOf(assetId);
  const v = versionOf(a.publishedVersionId);
  Modal.show({
    title: '获取资产包',
    body: `<div class="info-banner success"><svg class="ib-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg><div><strong>权限检查通过：</strong>你对资产 <strong>${htmlEscape(a.assetName)}</strong> 有访问权限。</div></div>
      <div style="padding:14px;background:var(--bg3);border-radius:10px">
        <div><strong>资产包 ID：</strong><span class="code-mono">PKG-${assetId.slice(-4)}-${v?.versionNumber}-${new Date().toISOString().slice(0,10).replace(/-/g,'')}</span></div>
        <div><strong>固定快照：</strong><span class="code-mono">${v?.snapshotId}</span></div>
        <div><strong>摘要：</strong><span class="code-mono">${v?.snapshotDigest?.slice(0,20)}…</span></div>
      </div>`,
    confirmText: '下载资产包',
    onConfirm: async ({ close }) => {
      await new Promise(r => setTimeout(r, 500));
      const ts = new Date().toISOString().replace('T',' ').slice(0,19);
      Toast.show('资产包已就绪', '可在本地下载使用', 'success');
      close();
    }
  });
}

function requestImport(assetId) {
  const a = roleOf(assetId);
  Modal.show({
    title: '发起导入',
    body: `<div class="form-field"><div class="form-label"><span class="req">*</span> 目标应用</div>
      <select class="form-select" id="importTarget">
        <option value="Sales Console">Sales Console (生产)</option>
        <option value="Procurement Portal">Procurement Portal</option>
        <option value="CRM Lite (Test)">CRM Lite (测试环境)</option>
        <option value="Analytics Platform">Analytics Platform</option>
        <option value="E-commerce Frontend">E-commerce Frontend</option>
      </select></div>
      <div class="info-banner warning" style="margin-top:14px"><svg class="ib-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg><div style="font-size:12px">为演示不同结果，请在下方选择预期。业务层会执行：权限 → 快照完整性 → 目标环境检查。</div></div>
      <div class="form-field"><div class="form-label">模拟结果</div>
        <select class="form-select" id="importResult">
          <option value="success">✅ 导入成功</option>
          <option value="fail-env">❌ 失败：目标环境版本过低</option>
        </select></div>`,
    confirmText: '发起导入',
    onConfirm: async ({ close }) => {
      await new Promise(r => setTimeout(r, 1000));
      const target = $('#importTarget').value;
      const res = $('#importResult').value;
      const ts = new Date().toISOString().replace('T',' ').slice(0,19);
      const v = versionOf(a.publishedVersionId);
      const pkgId = 'PKG-' + assetId.slice(-4) + '-' + (v?.versionNumber || 'V1.0').replace('.','') + '-' + ts.slice(0,10).replace(/-/g,'');
      const importId = 'IMP-' + ts.slice(0,4) + '-' + String(state.imports.length+1).padStart(4,'0');
      state.imports.push({
        importId, assetId, versionId: a.publishedVersionId, targetApp: target, targetAppCode: target.toUpperCase().slice(0,10),
        packageId: pkgId, importStatus: res === 'success' ? 'SUCCESS' : 'FAILED',
        importMessage: res === 'success' ? 'Provider 导入成功，已部署至目标应用。' : '目标环境版本过低，不满足依赖要求。',
        startedAt: ts, completedAt: ts, operator: 'u-zhaoyang', operatorName: '赵阳'
      });
      state.activities.unshift({ id:'ACT-'+Date.now(), time:ts, actor:'赵阳', actorId:'u-zhaoyang', type:'IMPORT', target:assetId, targetName:`${a.assetName} → ${target}`, targetType:'IMPORT', status:res==='success'?'DONE':'FAIL', message:res==='success'?'导入成功':'导入失败' });
      close();
      Toast.show(res === 'success' ? '导入成功' : '导入失败', '', res === 'success' ? 'success' : 'error', 3500);
      state.currentImportId = importId;
      navigate('import');
    }
  });
}

/* ============================
   20. 资源登记多步骤向导
   ============================ */
function renderWizard(root) {
  if (!state.wizard || !state.wizard.selectedResource) {
    // 初始化
    state.wizard = { step: 1, selectedResource: null, assetName: '', assetCode: '', assetDesc: '', visibility: 'TENANT_PUBLIC', depCheck: [], snapStatus: null, valRun: null };
  }
  const w = state.wizard;
  const steps = ['选择资源', '类型与依赖识别', '权限与存在性检查', '生成固定快照', '固定校验', '登记与投稿'];

  let stepContent = '';
  if (w.step === 1) stepContent = wizardStep1(w);
  else if (w.step === 2) stepContent = wizardStep2(w);
  else if (w.step === 3) stepContent = wizardStep3(w);
  else if (w.step === 4) stepContent = wizardStep4(w);
  else if (w.step === 5) stepContent = wizardStep5(w);
  else if (w.step === 6) stepContent = wizardStep6(w);

  root.innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">资源登记向导</div>
        <div class="page-subtitle">选择平台原生资源 → 识别依赖 → 校验 → 生成快照 → 登记 → 发起投稿</div>
      </div>
      <div class="page-actions">
        <button class="btn btn-secondary" onclick="state.wizard=null;navigate('assetList')">放弃</button>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <div class="wizard-steps">
          ${steps.map((label, i) => {
            const n = i + 1;
            const cls = n < w.step ? 'done' : n === w.step ? 'active' : '';
            const numShown = n < w.step ? '✓' : n;
            return `<div class="wizard-step ${cls}"><div class="wizard-step-num">${numShown}</div><div class="wizard-step-label">${label}</div></div>${n < steps.length ? '<div class="wizard-connector ' + (n < w.step ? 'done' : '') + '"></div>' : ''}`;
          }).join('')}
        </div>

        <div style="padding:0 20px 20px">${stepContent}</div>

        <div style="display:flex;gap:10px;justify-content:space-between;padding:16px 20px;border-top:1px solid var(--rule)">
          <div>
            ${w.step > 1 ? `<button class="btn btn-secondary" onclick="wizardPrev()">← 上一步</button>` : ''}
          </div>
          <div>
            ${w.step < 6 ? `<button class="btn btn-primary" onclick="wizardNext()">下一步 →</button>` : ''}
            ${w.step === 6 ? `<button class="btn btn-success" onclick="wizardComplete()">完成登记并返回列表</button>` : ''}
          </div>
        </div>
      </div>
    </div>
  `;
}

function wizardStep1(w) {
  // 选择平台原生资源
  return `
    <div class="info-banner info">
      <svg class="ib-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      <div>平台原生资源由各来源应用提供。选择后系统将自动识别资源类型、依赖、执行固定快照和校验。</div>
    </div>
    <div style="font-size:13px;font-weight:600;color:var(--ink);margin-bottom:10px">选择要登记的资源</div>
    ${state.platformResources.map(r => {
      const t = assetTypes.find(x => x.code === r.resourceType);
      const sel = w.selectedResource && w.selectedResource.resourceId === r.resourceId;
      return `<div class="step-select-card ${sel ? 'selected' : ''}" onclick="wizardPickResource('${r.resourceId}')">
        <div class="ssc-icon">${t?.icon || '📦'}</div>
        <div style="flex:1">
          <div class="ssc-name">${htmlEscape(r.resourceName)}</div>
          <div class="ssc-meta">${htmlEscape(r.sourceApp)} · 创建人 ${htmlEscape(r.ownerName)} · 最近更新 ${htmlEscape(r.updatedAt)}</div>
          <div class="ssc-desc"><span class="tag tag-info">${t?.name || r.resourceType}</span> · <span style="color:var(--muted)">资源 ID <span class="code-mono">${htmlEscape(r.resourceId)}</span> · 大小 ${fmtSize(r.size)}</span></div>
        </div>
      </div>`;
    }).join('')}
  `;
}

function wizardPickResource(id) {
  const r = state.platformResources.find(x => x.resourceId === id);
  state.wizard.selectedResource = r;
  // 自动填充
  state.wizard.assetName = r.resourceName;
  state.wizard.assetCode = r.resourceId.replace('RES-','').toUpperCase();
  state.wizard.assetDesc = '';
  renderWizard(document.getElementById('content'));
}

  const r = w.selectedResource;
  const t = assetTypes.find(x => x.code === r.resourceType);
  // 模拟：该资源可能有依赖

    { resourceId: 'RES-DEP-A01', resourceName: 'A01 基础库', depType: 'REQUIRED', autoFound: true },

  return `
    <div class="info-banner success">

      <div><strong>资源类型识别完成。</strong>已识别为 <strong>${t?.icon} ${t?.name || r.resourceType}</strong>，来源应用 <strong>${htmlEscape(r.sourceApp)}</strong>。</div>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">资源基本信息（系统自动识别）</div>
      <div class="detail-grid">
        <div class="detail-item"><div class="detail-label">资源 ID</div><div class="detail-value mono">${htmlEscape(r.resourceId)}</div></div>
        <div class="detail-item"><div class="detail-label">资源名称</div><div class="detail-value">${htmlEscape(r.resourceName)}</div></div>
        <div class="detail-item"><div class="detail-label">资源类型</div><div class="detail-value">${t?.icon || '📦'} ${htmlEscape(r.resourceType)}</div></div>
        <div class="detail-item"><div class="detail-label">来源应用</div><div class="detail-value">${htmlEscape(r.sourceApp)} <span class="code-mono">${htmlEscape(r.sourceAppCode)}</span></div></div>
        <div class="detail-item"><div class="detail-label">资源大小</div><div class="detail-value">${fmtSize(r.size)}</div></div>
        <div class="detail-item"><div class="detail-label">创建人</div><div class="detail-value">${htmlEscape(r.ownerName)}</div></div>
      </div>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">自动识别的依赖清单</div>
      <table class="table" style="min-width:0">
        <thead><tr><th>依赖资源</th><th>依赖类型</th><th>识别方式</th></tr></thead>
        <tbody>
          ${deps.map(d => `<tr>
            <td>${htmlEscape(d.resourceName)} <span class="code-mono">${htmlEscape(d.resourceId)}</span></td>
            <td>${d.depType==='REQUIRED' ? '<span class="tag tag-error">必需</span>' : '<span class="tag tag-info">可选</span>'}</td>
            <td><span class="tag tag-published">自动识别</span></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">资产业务信息（人工确认）</div>
      <div class="form-grid">
        <div class="form-field"><div class="form-label"><span class="req">*</span>资产名称</div><input class="form-input" value="${htmlEscape(w.assetName)}" oninput="state.wizard.assetName=this.value"></div>
        <div class="form-field"><div class="form-label"><span class="req">*</span>资产标识</div><input class="form-input" value="${htmlEscape(w.assetCode)}" oninput="state.wizard.assetCode=this.value"></div>
        <div class="form-field"><div class="form-label"><span class="req">*</span>可见性</div>
          <select class="form-select" onchange="state.wizard.visibility=this.value">
            <option value="TENANT_PUBLIC" ${w.visibility==='TENANT_PUBLIC'?'selected':''}>租户内可见</option>
            <option value="PLATFORM_PUBLIC" ${w.visibility==='PLATFORM_PUBLIC'?'selected':''}>平台公开</option>
            <option value="PRIVATE" ${w.visibility==='PRIVATE'?'selected':''}>私有（仅自己可见）</option>
          </select>
        </div>
        <div class="form-field full"><div class="form-label">资产描述 <span class="opt">（选填）</span></div><textarea class="form-textarea" oninput="state.wizard.assetDesc=this.value">${htmlEscape(w.assetDesc)}</textarea></div>
      </div>
    </div>
  `;
}

function wizardStep3(w) {
  // 模拟权限检查 + 依赖存在性检查
  const checks = [
    { label: '资源存在性', passed: true,  detail: '已在来源应用中确认该资源可正常读取' },
    { label: '来源应用权限', passed: true,  detail: `有 ${w.selectedResource.sourceApp} 的只读访问权限（RBAC）` },

/* — 版本操作 — */
function createNewVersion(assetId) {
  const a = roleOf(assetId);
  const versions = versionsOf(assetId);
  const lastNum = versions[0]?.versionNumber || 'V0.0';
  const base = parseFloat(lastNum.replace(/[^\d.]/g,''));
  const nextNum = 'V' + (base + 0.1).toFixed(1);
  const newVer = {
    versionId: 'VER-' + String(state.versions.length + 1).padStart(4,'0'),
    assetId, versionNumber: nextNum, versionStatus: 'DRAFT',
    snapshotId: null, snapshotDigest: null, snapshotSize: null, snapshotCreatedAt: null, frozenAt: null,
    createdBy: 'u-' + state.currentRole.toLowerCase(), createdAt: nowStr(), dependencies: []
  };
  state.versions.push(newVer);
  Toast.show('新版本已创建', `${a.assetName} · ${nextNum}，可继续编辑并执行快照生成`, 'success', 3500);
  openVersionDetail(newVer.versionId);
}

function freezeVersion(versionId) {
  const v = versionOf(versionId);
  if (!v) return;
  if (v.versionStatus !== 'DRAFT') { Toast.show('只有草稿版本可以生成快照', '该版本已冻结', 'warning', 2400); return; }

  Modal.show({
    title: `生成快照并冻结 ${v.versionNumber}`,
    body: `<div style="font-size:14px;line-height:1.65">
      <p>即将对 <strong>${htmlEscape(roleOf(v.assetId).assetName)}</strong> · <strong>${v.versionNumber}</strong> 执行：</p>
      <ul class="check-list" style="margin-top:10px">
        <li class="info"><span class="chk-icon">i</span>从来源应用读取资源主体内容</li>
        <li class="info"><span class="chk-icon">i</span>计算 SHA-256 摘要，生成固定快照</li>
        <li class="info"><span class="chk-icon">i</span>版本状态变更为 FROZEN，后续不可直接修改</li>
      </ul>
      <div class="info-banner warning" style="margin-top:14px;margin-bottom:0">
        <svg class="ib-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>
        <div><strong>一旦冻结，本版本的快照内容即固化。</strong>如需变更必须创建新版本。</div>
      </div>
    </div>`,
    confirmText: '确认生成并冻结',
    onConfirm: async ({ close }) => {
      // 模拟异步
      Toast.show('正在生成固定快照...', '', 'info', 1500);
      await new Promise(r => setTimeout(r, 900));
      v.snapshotId = 'SNAP-SHA256-' + v.versionId;
      v.snapshotDigest = Array.from({length: 64}, () => '0123456789ABCDEF'[Math.floor(Math.random()*16)]).join('');
      v.snapshotSize = Math.floor(Math.random() * 5_000_000) + 100_000;
      v.snapshotCreatedAt = nowStr();
      v.frozenAt = nowStr();
      v.versionStatus = 'FROZEN';
      close();
      Toast.show('快照已生成并冻结', `快照 ID：${v.snapshotId}`, 'success', 3500);
      // 触发校验
      runValidationOnVersion(versionId);
      // 刷新当前页面
      if (state.navPage === 'assetList') navigate('assetList');
      else if (state.navPage === 'assetDetail') { const a = roleOf(v.assetId); openAssetDetail(a.assetId); }
      else if (state.navPage === 'versionManage') navigate('versionManage');
    }
  });
}

function runValidationOnVersion(versionId) {
  const v = versionOf(versionId);
  // 简单模拟：大部分过，有一个版本会失败
  if (state.validations[versionId]) return;
  if (v.assetId === 'AST-2026-0005' || v.assetId === 'AST-2026-0003') {
    state.validations[versionId] = [
      { checkerType: 'RESOURCE_PRESENCE',  passed: true,  checkedAt: nowStr(), issues: [] },
      { checkerType: 'DEPENDENCY_ANALYSIS', passed: false, checkedAt: nowStr(), issues: [
        { issueCode: 'DEPENDENCY_NOT_FOUND', description: '依赖的资源 RES-XXX 不存在', severity: 'ERROR', resolutionStatus: 'OPEN', resourceRef: 'RES-XXX', resolutionSuggestion: '请重新选择或补充依赖' }
      ]},
      { checkerType: 'CONTRACT_COMPAT',    passed: true,  checkedAt: nowStr(), issues: [] },
      { checkerType: 'SECURITY_SCAN',      passed: true,  checkedAt: nowStr(), issues: [] }
    ];
  } else {
    state.validations[versionId] = [
      { checkerType: 'RESOURCE_PRESENCE',  passed: true, checkedAt: nowStr(), issues: [] },
      { checkerType: 'DEPENDENCY_ANALYSIS', passed: true, checkedAt: nowStr(), issues: [] },
      { checkerType: 'CONTRACT_COMPAT',    passed: true, checkedAt: nowStr(), issues: [] },
      { checkerType: 'SECURITY_SCAN',      passed: true, checkedAt: nowStr(), issues: [] }
    ];
  }
}

function submitVersionForValidation(versionId) {
  runValidationOnVersion(versionId);
  const vr = state.validations[versionId];
  const hasErr = vr.some(x => x.issues.some(i => i.severity === 'ERROR'));
  Toast.show('校验已完成', hasErr ? '存在阻断性错误' : '全部通过', hasErr ? 'warning' : 'success', 3200);
  openVersionDetail(versionId);
}

/* — 投稿操作 — */
function quickSubmit(versionId) {
  const v = versionOf(versionId);
  if (v.versionStatus !== 'FROZEN') { Toast.show('版本未冻结', '必须先生成快照并冻结版本', 'error', 2800); return; }
  // 校验阻断
  runValidationOnVersion(versionId);
  const vr = state.validations[versionId];
  const hasErr = vr.some(x => x.issues.some(i => i.severity === 'ERROR'));
  if (hasErr) {
    Modal.confirm({
      title: '存在阻断性校验错误',
      message: '业务规则：阻断性 ERROR 未清除时禁止投稿。请修正依赖或更换资源后重新生成快照。',
      confirmText: '我知道了',
      danger: true,
      onConfirm: async ({ close }) => { close(); Toast.show('投稿已被业务层阻止', '', 'error', 2400); }
    });
    return;
  }
  // 创建新投稿或替换 DRAFT
  const asset = roleOf(v.assetId);
  const existingDraft = state.submissions.find(s => s.assetId === v.assetId && s.versionId === versionId && s.submissionStatus === 'DRAFT');
  if (existingDraft) {
    existingDraft.submissionStatus = 'PENDING_APPROVAL';
    existingDraft.submittedAt = nowStr();
    existingDraft.workflowInstanceId = 'WF-APPROVAL-' + Math.floor(Math.random()*100000);
  } else {
    state.submissions.push({
      submissionId: 'SUB-2026-' + String(state.submissions.length + 1).padStart(4,'0'),
      assetId: v.assetId, versionId: versionId,
      submissionStatus: 'PENDING_APPROVAL',
      submittedBy: 'u-' + state.currentRole.toLowerCase(), submittedByName: '当前用户',
      submittedAt: nowStr(),
      workflowInstanceId: 'WF-APPROVAL-' + Math.floor(Math.random()*100000),
      approvalResult: null, approvalComment: null, approvalCompletedAt: null,
      approvalBy: null, approvalByName: null,
      publicationStatus: 'NOT_STARTED', publicationMessage: null
    });
  }
  Toast.show('投稿已提交', '等待审批中', 'success', 3500);
  state.activities.unshift({ id:'ACT-QS-'+Date.now(), time: nowStr(), actor:'当前用户', actorId:'u-'+state.currentRole.toLowerCase(), type:'SUBMIT', target:v.assetId, targetName:`${asset.assetName} ${v.versionNumber} 投稿`, targetType:'SUBMISSION', status:'PENDING', message:'重新发起投稿' });
  if (state.navPage === 'assetDetail') navigate('assetDetail');
  else navigate('submissionList');
}

function submitDraftSubmission(submissionId) {
  const s = state.submissions.find(x => x.submissionId === submissionId);
  s.submissionStatus = 'PENDING_APPROVAL';
  s.submittedAt = nowStr();
  s.workflowInstanceId = 'WF-APPROVAL-' + Math.floor(Math.random()*100000);
  Toast.show('草稿投稿已提交', '', 'success', 3000);
  navigate('submissionList');
}

function cancelSubmission(submissionId) {
  const s = state.submissions.find(x => x.submissionId === submissionId);
  Modal.confirm({
    title: '取消投稿',
    message: `即将取消投稿 ${s.submissionId}。取消后该投稿不再进入审批流程，版本仍可用于后续重新发起投稿。`,
    confirmText: '确认取消',
    danger: true,
    onConfirm: async ({ close }) => {
      s.submissionStatus = 'CANCELLED';
      close();
      Toast.show('投稿已取消', '', 'success', 3000);
      navigate('submissionList');
    }
  });
}

/* — 审核操作 — */
function approveSubmission(submissionId) {
  const s = state.submissions.find(x => x.submissionId === submissionId);
  const v = versionOf(s.versionId);
  // 业务层前置检查
  if (!v || v.versionStatus !== 'FROZEN') { Toast.show('版本未冻结！', '审批通过将被业务层拒绝', 'error', 2800); return; }
  runValidationOnVersion(s.versionId);
  const hasErr = state.validations[s.versionId].some(x => x.issues.some(i => i.severity === 'ERROR'));
  if (hasErr) { Toast.show('存在阻断性错误！', '业务层拒绝审批通过', 'error', 2800); return; }
  Modal.show({
    title: '审批通过',
    body: `<div style="font-size:14px;line-height:1.65">
      <p>即将通过投稿 <strong>${s.submissionId}</strong>。系统将自动调用现有工作流完成审批，然后进入发布处理。</p>
      <div class="form-field" style="margin-top:14px"><div class="form-label">审批意见 <span class="opt">(选填)</span></div>
        <textarea id="approveComment" class="form-textarea" placeholder="同意发布，校验通过..."></textarea>
      </div>
      <div class="info-banner info" style="margin-top:14px;margin-bottom:0">
        <svg class="ib-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        <div><strong>重要：</strong>审批通过 ≠ 发布成功。管理员仍需在「发布与生命周期」中触发实际发布。</div>
      </div>
    </div>`,
    confirmText: '确认通过',
    onConfirm: async ({ close }) => {
      const comment = $('#approveComment').value.trim();
      await new Promise(r => setTimeout(r, 800));
      s.approvalResult = 'APPROVED';
      s.approvalComment = comment || '审批通过';
      s.approvalCompletedAt = nowStr();
      s.approvalBy = 'u-liuying'; s.approvalByName = '刘颖';
      s.submissionStatus = 'APPROVED';
      close();
      Toast.show('审批已通过', '请由管理员触发发布', 'success', 3500);
      state.activities.unshift({ id:'ACT-AP'+Date.now(), time:nowStr(), actor:'刘颖', actorId:'u-liuying', type:'APPROVE', target:s.submissionId, targetName:`${roleOf(s.assetId).assetName} 投稿`, targetType:'SUBMISSION', status:'DONE', message:'审批通过' });
      navigate('review');
    }
  });
}

function returnSubmission(submissionId) {
  const s = state.submissions.find(x => x.submissionId === submissionId);
  Modal.show({
    title: '退回投稿',
    body: `<div style="font-size:14px;line-height:1.65">
      <p>退回 <strong>${s.submissionId}</strong>，贡献者将看到退回原因并需修正后重新发起投稿。</p>
      <div class="form-field" style="margin-top:14px"><div class="form-label"><span class="req">*</span>退回原因</div>
        <textarea id="returnComment" class="form-textarea" placeholder="请说明需要修正的具体内容和位置..."></textarea>
        <div class="form-hint">退回原因应指向明确可操作的修正项，避免模糊描述。</div>
      </div>
    </div>`,
    confirmText: '确认退回',
    danger: true,
    onConfirm: async ({ close }) => {
      const comment = $('#returnComment').value.trim();
      if (!comment) { Toast.show('请填写退回原因', '', 'warning'); throw new Error(); }
      await new Promise(r => setTimeout(r, 600));
      s.approvalResult = 'RETURNED';
      s.approvalComment = comment;
      s.approvalCompletedAt = nowStr();
      s.approvalBy = 'u-liuying'; s.approvalByName = '刘颖';
      s.submissionStatus = 'RETURNED';
      close();
      Toast.show('投稿已退回', '', 'success', 3000);
      state.activities.unshift({ id:'ACT-RT'+Date.now(), time:nowStr(), actor:'刘颖', actorId:'u-liuying', type:'RETURN', target:s.submissionId, targetName:`${roleOf(s.assetId).assetName} 投稿`, targetType:'SUBMISSION', status:'DONE', message:'退回：'+comment.slice(0,30) });
      navigate('review');
    }
  });
}

/* — 发布操作 — */
function retryPublish(submissionId) {
  const s = state.submissions.find(x => x.submissionId === submissionId);
  const v = versionOf(s.versionId);
  const a = roleOf(s.assetId);
  // 业务层检查
  if (s.approvalResult !== 'APPROVED') { Toast.show('审批未通过，无法发布', '', 'error', 2800); return; }
  if (!v || v.versionStatus !== 'FROZEN') { Toast.show('版本未冻结', '禁止绕行：先冻结版本', 'error', 2800); return; }
  if (!v.snapshotId) { Toast.show('固定快照不存在', '禁止发布', 'error', 2800); return; }

  Modal.show({
    title: `发布 ${a.assetName} ${v.versionNumber}`,
    body: `<div style="font-size:14px;line-height:1.65">
      <p>即将触发发布处理：</p>
      <ul class="check-list" style="margin-top:10px">
        <li class="info"><span class="chk-icon">i</span>调用来源应用 Provider 生成资产包</li>
        <li class="info"><span class="chk-icon">i</span>更新目录索引</li>
        <li class="info"><span class="chk-icon">i</span>资产状态从 DRAFT 变更为 PUBLISHED</li>
      </ul>
      ${s.publicationStatus === 'FAILED' ? `<div class="info-banner error" style="margin-top:12px;margin-bottom:0">
        <svg class="ib-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
        <div><strong>上次失败原因：</strong>${htmlEscape(s.publicationMessage || '—')}</div>
      </div>` : ''}
      <div class="form-field" style="margin-top:14px"><div class="form-label">模拟发布结果 <span class="opt">(演示用)</span></div>
        <select id="pubMode" class="form-select"><option value="success">成功</option><option value="fail">失败（Provider 超时）</option></select>
      </div>
    </div>`,
    confirmText: '立即发布',
    onConfirm: async ({ close }) => {
      const mode = $('#pubMode').value;
      s.publicationStatus = 'PROCESSING';
      await new Promise(r => setTimeout(r, 1100));
      if (mode === 'fail' || Math.random() < 0.1) {
        s.publicationStatus = 'FAILED';
        s.publicationMessage = '目标 Provider 服务超时，资产包生成失败。请稍后重试或联系来源应用管理员。';
        a.assetStatus = 'DRAFT'; // 失败时不能变已发布
        close();
        Toast.show('发布失败', s.publicationMessage, 'error', 5000);
        state.activities.unshift({ id:'ACT-PF'+Date.now(), time:nowStr(), actor:'资产管理员', actorId:'u-admin', type:'PUBLISH', target:a.assetId, targetName:`${a.assetName} ${v.versionNumber}`, targetType:'ASSET', status:'FAIL', message:'发布失败：Provider 超时' });
      } else {
        s.publicationStatus = 'SUCCESS';
        s.publicationMessage = '资产发布成功，目录已更新。';
        a.assetStatus = 'PUBLISHED';
        a.publishedVersionId = v.versionId;
        a.updatedAt = nowStr();
        close();
        Toast.show('发布成功', `${a.assetName} ${v.versionNumber} 已进入平台目录`, 'success', 5000);
        state.activities.unshift({ id:'ACT-PS'+Date.now(), time:nowStr(), actor:'资产管理员', actorId:'u-admin', type:'PUBLISH', target:a.assetId, targetName:`${a.assetName} ${v.versionNumber}`, targetType:'ASSET', status:'DONE', message:'发布成功' });
      }
      navigate('publish');
    }
  });
}

/* — 生命周期操作 — */
function disableAsset(assetId) {
  const a = roleOf(assetId);
  Modal.confirm({
    title: '禁用资产',
    message: `禁用后资产 <strong>${a.assetName}</strong> 将从平台目录中移除，其他租户不可见；已发起的导入不受影响，但新的授权申请将被拒绝。<br><br>禁用为可逆操作，可随时重新启用。`,
    confirmText: '确认禁用',
    danger: true,
    onConfirm: async ({ close }) => {
      a.assetStatus = 'DISABLED';
      a.updatedAt = nowStr();
      close();
      Toast.show('资产已禁用', '', 'success', 3000);
      state.activities.unshift({ id:'ACT-DS'+Date.now(), time:nowStr(), actor:'资产管理员', actorId:'u-admin', type:'DISABLE', target:a.assetId, targetName:a.assetName, targetType:'ASSET', status:'DONE', message:'禁用资产' });
      const p = state.navPage; navigate(p);
    }
  });
}
function enableAsset(assetId) {
  const a = roleOf(assetId);
  a.assetStatus = a.publishedVersionId ? 'PUBLISHED' : 'DRAFT';
  a.updatedAt = nowStr();
  Toast.show('资产已启用', `当前状态：${ASSET_STATUS[a.assetStatus].label}`, 'success', 3000);
  state.activities.unshift({ id:'ACT-EN'+Date.now(), time:nowStr(), actor:'资产管理员', actorId:'u-admin', type:'ENABLE', target:a.assetId, targetName:a.assetName, targetType:'ASSET', status:'DONE', message:'重新启用' });
  navigate(state.navPage);
}
function archiveAsset(assetId) {
  const a = roleOf(assetId);
  Modal.confirm({
    title: '归档资产',
    message: `归档是不可逆操作。归档后资产将不再对外提供，所有授权和导入入口关闭，但历史记录和操作审计可继续追溯。<br><br>确认归档 <strong>${a.assetName}</strong>？`,
    confirmText: '确认归档',
    danger: true,
    onConfirm: async ({ close }) => {
      a.assetStatus = 'ARCHIVED';
      a.updatedAt = nowStr();
      close();
      Toast.show('资产已归档', '', 'success', 3000);
      state.activities.unshift({ id:'ACT-AR'+Date.now(), time:nowStr(), actor:'资产管理员', actorId:'u-admin', type:'ARCHIVE', target:a.assetId, targetName:a.assetName, targetType:'ASSET', status:'DONE', message:'归档资产' });
      navigate(state.navPage);
    }
  });
}

/* — 导入向导 — */
function openImportWizard(assetId) {
  const a = roleOf(assetId);
  const pubVer = versionOf(a.publishedVersionId);
  const vrs = validationsOf(pubVer?.versionId);

  Modal.show({
    title: `申请导入 ${a.assetName}`,
    size: 600,
    body: `<div style="font-size:14px;line-height:1.65">
      <div class="info-banner info" style="margin-bottom:12px">
        <svg class="ib-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        <div>流程：<strong>检查可见性 → 授权检查 → 获取资产包 → Provider 导入 → 记录结果</strong>。导入失败不会修改源资产或固定快照。</div>
      </div>

      <div class="detail-section">
        <div class="detail-grid">
          <div class="detail-item"><div class="detail-label">资产</div><div class="detail-value">${htmlEscape(a.assetName)}</div></div>
          <div class="detail-item"><div class="detail-label">发布版本</div><div class="detail-value">${pubVer?.versionNumber || '—'}</div></div>
          <div class="detail-item"><div class="detail-label">固定快照</div><div class="detail-value mono">${pubVer?.snapshotId || '—'}</div></div>
          <div class="detail-item"><div class="detail-label">可见性</div><div class="detail-value">${a.visibility}</div></div>
        </div>
      </div>

      <div class="form-field"><div class="form-label"><span class="req">*</span>目标应用</div>
        <select id="targetApp" class="form-select">
          <option value="SALES-CON">Sales Console (CRM)</option>
          <option value="PROC-PTL">Procurement Portal</option>
          <option value="ANA-PLT">Analytics Platform</option>
          <option value="EC-FE">E-commerce Frontend</option>
          <option value="CRM-LITE-T">CRM Lite (Test)</option>
        </select>
        <div class="form-hint">导入到测试环境可能因版本过低失败，这是预期的业务异常分支。</div>
      </div>
    </div>`,
    confirmText: '发起导入',
    onConfirm: async ({ close }) => {
      const targetCode = $('#targetApp').value;
      const targetName = $('#targetApp option:checked').textContent;
      if (!pubVer) { Toast.show('没有发布版本', '', 'error'); close(); return; }
      // 业务层：禁用/归档资产不能导入
      if (a.assetStatus !== 'PUBLISHED') { Toast.show('资产当前不可导入', '状态：'+ASSET_STATUS[a.assetStatus].label, 'error', 2800); close(); return; }

      Toast.show('正在获取资产包...', '', 'info', 1500);
      await new Promise(r => setTimeout(r, 700));

      // 模拟：CRM-LITE-T 失败
      const willFail = targetCode === 'CRM-LITE-T';
      const importId = 'IMP-2026-' + String(state.imports.length + 1).padStart(4,'0');
      const started = nowStr();

      Toast.show('正在调用 Provider 导入...', '', 'info', 1500);
      await new Promise(r => setTimeout(r, 1000));

      const completed = nowStr();
      state.imports.unshift({
        importId, assetId, versionId: pubVer.versionId,
        targetApp: targetName, targetAppCode: targetCode,
        packageId: 'PKG-' + pubVer.versionId.replace('VER-','') + '-' + new Date().toISOString().slice(0,10).replace(/-/g,''),
        importStatus: willFail ? 'FAILED' : 'SUCCESS',
        importMessage: willFail ? '目标环境版本过低，不支持客户标签依赖（需要 v3.0+）' : '应用模块导入成功，已部署至生产环境',
        startedAt: started, completedAt: completed,
        operator: 'u-' + state.currentRole.toLowerCase(), operatorName: '当前用户'
      });

      close();
      if (willFail) Toast.show('导入失败', '不会修改源资产或固定快照', 'error', 5000);
      else Toast.show('导入成功', '', 'success', 3500);

      state.activities.unshift({ id:'ACT-IM'+Date.now(), time:completed, actor:'当前用户', actorId:'u-'+state.currentRole.toLowerCase(), type:'IMPORT', target:a.assetId+' / '+targetName, targetName:`${a.assetName} → ${targetName}`, targetType:'IMPORT', status: willFail ? 'FAIL' : 'DONE', message: willFail ? '导入失败' : '导入成功' });

      if (hasPerm('import')) navigate('import');
      else navigate('catalog');
    }
  });
}

/* ============================
   启动
   ============================ */
document.addEventListener('DOMContentLoaded', () => {
  renderNav();
  renderTopbar();
  navigate('dashboard');
});

</script>
</body>
</html>
