<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>建筑冷源系统优化平台原型</title>
  <link rel="stylesheet" href="./vendor/element-plus.css" />
  <style>
    #boot-error { position: fixed; top: 0; left: 0; right: 0; z-index: 9999; margin: 12px; padding: 16px 20px; background: #fff1f0; border: 1px solid #ffa39e; border-radius: 6px; color: #cf1322; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-break: break-all; box-shadow: 0 2px 8px rgba(0,0,0,.15); display: none; }
    #boot-status { position: fixed; bottom: 8px; right: 12px; z-index: 9999; padding: 4px 10px; background: #fff; border: 1px solid #d9d9d9; border-radius: 4px; color: #595959; font-size: 11px; font-family: monospace; }
  </style>
  <style>
    html, body, #app { height: 100%; margin: 0; padding: 0; }
    body { font-family: -apple-system, "Microsoft YaHei", Arial, sans-serif; background: #f0f2f5; }
    .layout-aside { background: #001529; color: #fff; transition: width 0.2s; }
    .layout-logo { height: 60px; line-height: 60px; text-align: center; color: #fff; font-size: 16px; font-weight: 600; background: #002140; overflow: hidden; white-space: nowrap; }
    .layout-header { background: #fff; border-bottom: 1px solid #e8e8e8; display: flex; align-items: center; padding: 0 20px; }
    .layout-header h2 { margin: 0; font-size: 18px; font-weight: 600; color: #1f2d3d; }
    .layout-main { padding: 16px; background: #f0f2f5; }
    .page-card { background: #fff; border-radius: 4px; padding: 16px; box-shadow: 0 1px 4px rgba(0,21,41,0.06); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
    .toolbar .el-input, .toolbar .el-select { width: 200px; }
    .toolbar .spacer { flex: 1; }
    .table-ops { display: flex; gap: 4px; flex-wrap: nowrap; }
    .pagination-wrap { display: flex; justify-content: flex-end; margin-top: 16px; }
    .form-section-tip { color: #909399; font-size: 12px; margin-bottom: 12px; }
    .master-row-expand { color: #409eff; cursor: pointer; }
    .el-collapse-item__header { font-weight: 600; }
    .device-list-empty { color: #c0c4cc; text-align: center; padding: 12px; font-size: 12px; }
  </style>
</head>
<body>
  <div id="boot-error"></div>
  <div id="boot-status">boot: 等待脚本...</div>
  <div id="app"></div>
  <!-- 根布局模板作为字符串定义在 app.js 中，避免浏览器对 in-DOM 模板的 HTML 解析（自闭合标签会破坏 v-if/v-else 相邻关系） -->


  <script>
    // 启动错误捕获：把任何加载/运行错误直接显示在页面上，便于定位真实问题
    (function () {
      var errEl = document.getElementById('boot-error');
      var stEl = document.getElementById('boot-status');
      function showErr(msg) {
        try { errEl.textContent = String(msg); errEl.style.display = 'block'; } catch (e) {}
        try { stEl.textContent = 'boot: 出错'; } catch (e) {}
      }
      window.addEventListener('error', function (e) {
        // 忽略跨域 previewer-tools 脚本的 Script error
        if (e.message === 'Script error.' && (e.filename || '').indexOf('unpkg') === -1 && !e.lineno) return;
        showErr('window.error: ' + (e.message || '(unknown)') + '\nfile: ' + (e.filename || '?') + ':' + (e.lineno || '?') + ':' + (e.colno || '?'));
      });
      window.addEventListener('unhandledrejection', function (e) {
        showErr('Promise rejection: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason));
      });
      window.__bootShowErr = showErr;
      window.__bootSetStatus = function (s) { try { stEl.textContent = 'boot: ' + s; } catch (e) {} };
    })();
  </script>
  <script src="./vendor/vue.global.prod.js" onerror="window.__bootShowErr('加载失败: vendor/vue.global.prod.js')"></script>
  <script>window.__bootSetStatus('Vue 加载: ' + (typeof Vue !== 'undefined'));</script>
  <script src="./vendor/element-plus.full.min.js" onerror="window.__bootShowErr('加载失败: vendor/element-plus.full.min.js')"></script>
  <script>window.__bootSetStatus('EP 加载: ' + (typeof ElementPlus !== 'undefined'));</script>
  <script src="./vendor/icons-vue.iife.min.js" onerror="window.__bootShowErr('加载失败: vendor/icons-vue.iife.min.js')"></script>
  <script>window.__bootSetStatus('Icons 加载: ' + (typeof ElementPlusIconsVue !== 'undefined'));</script>
  <!-- 页面组件 -->
  <script src="./js/pages/project-info.js"></script>
  <script src="./js/pages/history-run.js"></script>
  <script src="./js/pages/algorithm-config.js"></script>
  <script src="./js/pages/strategy-library.js"></script>
  <script src="./js/pages/optimal-strategy.js"></script>
  <script>window.__bootSetStatus('页面组件已注册: ' + Object.keys(window.PageComponents || {}).join(','));</script>
  <script src="./js/app.js" onerror="window.__bootShowErr('app.js 执行/加载失败')"></script>
  <script>window.__bootSetStatus('app.js 执行完成');</script>
</body>
</html>
