<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>建筑冷源系统优化平台原型</title>
  <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css" />
  <style>
    html, body, #app { height: 100%; margin: 0; padding: 0; }
    body { font-family: -apple-system, "Microsoft YaHei", Arial, sans-serif; background: #f0f2f5; }
    .layout-aside { background: #001529; color: #fff; transition: width 0.2s; }
    .layout-logo { height: 60px; line-height: 60px; text-align: center; color: #fff; font-size: 16px; font-weight: 600; background: #002140; overflow: hidden; white-space: nowrap; }
    .layout-header { background: #fff; border-bottom: 1px solid #e8e8e8; display: flex; align-items: center; padding: 0 20px; }
    .layout-header h2 { margin: 0; font-size: 18px; font-weight: 600; color: #1f2d3d; }
    .layout-main { padding: 16px; background: #f0f2f5; }
    .page-card { background: #fff; border-radius: 4px; padding: 16px; box-shadow: 0 1px 4px rgba(0,21,41,0.06); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
    .toolbar .el-input, .toolbar .el-select { width: 200px; }
    .toolbar .spacer { flex: 1; }
    .table-ops { display: flex; gap: 4px; flex-wrap: nowrap; }
    .pagination-wrap { display: flex; justify-content: flex-end; margin-top: 16px; }
    .form-section-tip { color: #909399; font-size: 12px; margin-bottom: 12px; }
    .master-row-expand { color: #409eff; cursor: pointer; }
    .el-collapse-item__header { font-weight: 600; }
    .device-list-empty { color: #c0c4cc; text-align: center; padding: 12px; font-size: 12px; }
  </style>
</head>
<body>
  <div id="app">
    <el-container style="height:100%;">
      <el-aside class="layout-aside" :width="collapsed ? '64px' : '220px'">
        <div class="layout-logo">{{ collapsed ? '冷源' : '建筑冷源优化平台' }}</div>
        <el-menu
          :default-active="activeMenu"
          :collapse="collapsed"
          background-color="#001529"
          text-color="#bfc7d2"
          active-text-color="#fff"
          @select="handleMenuSelect"
        >
          <el-menu-item index="project">
            <el-icon><Document /></el-icon>
            <template #title>项目信息</template>
          </el-menu-item>
          <el-menu-item index="history">
            <el-icon><Histogram /></el-icon>
            <template #title>历史运行</template>
          </el-menu-item>
          <el-menu-item index="algorithm">
            <el-icon><Setting /></el-icon>
            <template #title>算法参数配置</template>
          </el-menu-item>
          <el-menu-item index="strategy">
            <el-icon><Files /></el-icon>
            <template #title>策略库</template>
          </el-menu-item>
          <el-menu-item index="optimal">
            <el-icon><Trophy /></el-icon>
            <template #title>最优策略</template>
          </el-menu-item>
        </el-menu>
      </el-aside>
      <el-container>
        <el-header class="layout-header">
          <el-button text @click="collapsed = !collapsed">
            <el-icon size="20"><Fold v-if="!collapsed" /><Expand v-else /></el-icon>
          </el-button>
          <h2>{{ menuTitle }}</h2>
        </el-header>
        <el-main class="layout-main">
          <component :is="currentPage"></component>
        </el-main>
      </el-container>
    </el-container>
  </div>

  <script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus@2.4.4/dist/index.full.min.js"></script>
  <script src="https://unpkg.com/@element-plus/icons-vue@2.3.1/dist/index.iife.min.js"></script>
  <!-- 页面组件 -->
  <script src="./js/pages/project-info.js"></script>
  <script src="./js/pages/history-run.js"></script>
  <script src="./js/pages/algorithm-config.js"></script>
  <script src="./js/pages/strategy-library.js"></script>
  <script src="./js/pages/optimal-strategy.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
